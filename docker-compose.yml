version: '3.8'

services:
  # ============================================
  # BASE DE DONNÉES POSTGRESQL
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: autotech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autotech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lilpas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autotech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND LARAVEL
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autotech-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: autotech_db
      DB_USERNAME: postgres
      DB_PASSWORD: lilpas
      FRONTEND_URL: http://localhost:4200
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    networks:
      - autotech-network

  # ============================================
  # FRONTEND ANGULAR
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autotech-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - autotech-network

  # ============================================
  # JENKINS CI/CD
  # ============================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: autotech-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    networks:
      - autotech-network

  # ============================================
  # SONARQUBE ANALYSE DE CODE
  # ============================================
  sonarqube:
    image: sonarqube:community
    container_name: autotech-sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - autotech-network

  # ============================================
  # BASE DE DONNÉES POUR SONARQUBE
  # ============================================
  sonarqube-db:
    image: postgres:15-alpine
    container_name: autotech-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    networks:
      - autotech-network

# ============================================
# VOLUMES PERSISTANTS
# ============================================
volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  jenkins_home:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_db:
    driver: local

# ============================================
# RÉSEAU
# ============================================
networks:
  autotech-network:
    driver: bridge


