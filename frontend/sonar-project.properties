# ============================================
# CONFIGURATION SONARQUBE - FRONTEND ANGULAR
# ============================================

# Informations du projet
sonar.projectKey=autotech-crm-frontend
sonar.projectName=AUTOTECH CRM - Frontend
sonar.projectVersion=1.0.0

# Répertoires sources
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/environments/**,**/assets/**

# Langage
sonar.language=ts

# Encodage
sonar.sourceEncoding=UTF-8

# TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Règles de qualité
sonar.qualitygate.wait=true

# Paramètres Angular
sonar.typescript.node=node_modules


