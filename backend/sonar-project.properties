# ============================================
# CONFIGURATION SONARQUBE - BACKEND LARAVEL
# ============================================

# Informations du projet
sonar.projectKey=AUTOTECH-SERVICES
sonar.projectName=AUTOTECH SERVICES
sonar.projectVersion=1.0.0

# Répertoires sources (SANS le dossier tests)
sonar.sources=app,config,database,routes,resources
sonar.tests=tests

# Exclusions
sonar.exclusions=**/vendor/**,**/storage/**,**/bootstrap/cache/**,**/public/**,**/node_modules/**,**/*.blade.php

# Encodage
sonar.sourceEncoding=UTF-8

# Rapports de couverture de code (optionnels, ignorés si absents)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=test-report.xml

# Règles de qualité
sonar. qualitygate.wait=true
